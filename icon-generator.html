<!DOCTYPE html>
<!--
  icon-generator.html
  ---------------------------------------------------------------------
  This page is a TOOL, not part of the app itself. You open it once in
  your browser, click each "Download" button, and save the file into
  the life-app/icons/ folder. That gives the app the icon images iOS
  needs to show on your Home Screen. After that, you never need to
  open this page again (unless you want to redesign the icon later).

  Why this exists: normally you'd make an icon in a design tool like
  Photoshop or Figma. This page draws one directly in the browser using
  <canvas> instead, so you don't need to install anything extra.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Life App — Icon Generator</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111; color: #fff; padding: 32px; text-align: center; }
  h1 { font-size: 20px; }
  p { color: #aaa; max-width: 480px; margin: 8px auto 32px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
  .card { background: #1c1c1e; border-radius: 16px; padding: 16px; }
  canvas { border-radius: 12px; display: block; margin: 0 auto 12px; }
  button { background: #0a84ff; color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
  button:hover { background: #3396ff; }
  code { background: #000; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Life App Icon Generator</h1>
  <p>
    Click each "Download" button below, then move the downloaded file into
    your <code>life-app/icons/</code> folder using the exact filename shown.
    This is a placeholder icon — you can redesign it anytime by editing the
    <code>drawIcon()</code> function near the bottom of this file.
  </p>
  <div class="row" id="cards"></div>

<script>
// Each icon iOS/PWA needs, with its target pixel size and expected filename.
const ICONS = [
  { size: 180, filename: 'icon-180.png', label: 'iPhone Home Screen (180×180)' },
  { size: 192, filename: 'icon-192.png', label: 'PWA standard (192×192)' },
  { size: 512, filename: 'icon-512.png', label: 'PWA large (512×512)' },
  { size: 512, filename: 'icon-512-maskable.png', label: 'PWA maskable (512×512)', maskable: true },
];

// Draws the actual icon artwork onto a canvas context.
// size = the canvas width/height in pixels. maskable = leave extra padding
// around the edges, since Android crops maskable icons into different shapes.
function drawIcon(ctx, size, maskable) {
  const pad = maskable ? size * 0.16 : 0;

  // Background: a smooth diagonal gradient, iOS-app-icon style.
  const gradient = ctx.createLinearGradient(0, 0, size, size);
  gradient.addColorStop(0, '#0A84FF');
  gradient.addColorStop(1, '#5E5CE6');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);

  // A simple bold "L" mark, centered, representing "Life".
  ctx.fillStyle = '#FFFFFF';
  ctx.font = `bold ${size - pad * 2 - size * 0.28}px -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('L', size / 2, size / 2 + size * 0.04);
}

const cardsEl = document.getElementById('cards');

ICONS.forEach(({ size, filename, label, maskable }) => {
  const card = document.createElement('div');
  card.className = 'card';

  const canvas = document.createElement('canvas');
  // Draw at full resolution, but shrink the on-screen preview so it fits nicely.
  canvas.width = size;
  canvas.height = size;
  canvas.style.width = '120px';
  canvas.style.height = '120px';
  const ctx = canvas.getContext('2d');
  drawIcon(ctx, size, maskable);

  const caption = document.createElement('div');
  caption.textContent = label;
  caption.style.fontSize = '12px';
  caption.style.color = '#aaa';
  caption.style.marginBottom = '10px';

  const btn = document.createElement('button');
  btn.textContent = `Download ${filename}`;
  btn.onclick = () => {
    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };

  card.appendChild(canvas);
  card.appendChild(caption);
  card.appendChild(btn);
  cardsEl.appendChild(card);
});
</script>
</body>
</html>
