<!DOCTYPE html>
<!--
  index.html
  ---------------------------------------------------------------------
  This is the ONLY html page in the whole app. Every section (Dashboard,
  Meals, Grocery, etc.) is just JavaScript that swaps out the contents of
  <main id="app-content"> below — nothing ever navigates to a different
  .html file. That's what makes it feel like a native app instead of a
  website: no page reloads, no flicker, just content sliding in and out.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>CHAPHQ</title>

<!-- The CHAPHQ font trio: Space Grotesk (headers + wordmark), Inter
     (body text), IBM Plex Mono (workout data: weights, reps, durations).
     Loads from Google Fonts when online; offline it falls back to system
     fonts. The files can be self-hosted later for guaranteed offline use. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

<!--
  This tiny inline script runs immediately, before any CSS or other
  scripts load. Its only job is: if the Settings page previously saved a
  manual light/dark choice, apply it right away — otherwise you'd briefly
  see the wrong theme flash on screen before the rest of the app catches up.
-->
<script>
  (function () {
    try {
      var savedTheme = localStorage.getItem('liamhq-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (err) {}
  })();
</script>

<!--
  Boot splash styles live here, inline, instead of in base.css — this
  way the black background + centered seal show up the INSTANT the page
  starts loading, before any external stylesheet has had a chance to
  arrive. #boot-splash-hidden (added by app.js once the app is ready)
  fades it out and then removes it from layout entirely.
-->
<style>
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0A0C10;
    transition: opacity 0.4s ease;
  }
  #boot-splash img {
    width: 55vw;
    max-width: 260px;
  }
  #boot-splash.boot-splash-hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>

<!-- ===== PWA basics: lets any browser install this as an app ===== -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0A0C10" />

<!-- ===== iOS-specific tags: Safari ignores manifest.json for a lot of this,
     so these tags are what actually make "Add to Home Screen" look and
     behave like a real app on an iPhone. ===== -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CHAPHQ" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />

<!-- ===== Design system + shared components (order matters: variables first) ===== -->
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/navbar.css" />

<!-- ===== Per-section stylesheets (only the active section's styles actually apply) ===== -->
<link rel="stylesheet" href="css/sections/dashboard.css" />
<link rel="stylesheet" href="css/sections/gym.css" />
<link rel="stylesheet" href="css/sections/food.css" />
<link rel="stylesheet" href="css/sections/investing.css" />
<link rel="stylesheet" href="css/sections/school.css" />
<link rel="stylesheet" href="css/sections/settings.css" />
</head>
<body>

  <!-- Boot splash: the CHAPHQ seal on brand-black, visible the instant
       the app opens (styles are inline in the head so nothing has to
       load first). app.js fades it out once the app is ready. -->
  <div id="boot-splash">
    <img src="icons/seal.png" alt="CHAPHQ — Non Sine Periculo" />
  </div>

  <!-- Everything a section renders goes inside here. router.js controls this. -->
  <main id="app-content"></main>

  <!-- The bottom tab bar is always visible, on every screen. navbar.js controls this. -->
  <nav id="app-navbar"></nav>

  <!-- Reusable slide-up sheet used by sections for "Add" forms etc. modal.js controls this. -->
  <div id="app-modal-root"></div>

  <!--
    type="module" lets us use import/export between our .js files (that's
    what makes the "one file per section" structure possible) without any
    build step — modern browsers, including iOS Safari, support this
    natively.
  -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
